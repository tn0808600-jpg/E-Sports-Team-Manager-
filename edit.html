<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Player</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#050816;
    color:white;
}

.container{
    width:500px;
    margin:80px auto;
    background:#111827;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(139,92,246,.3);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#8b5cf6;
}

input, select{
    width:100%;
    padding:14px;
    margin-top:10px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#7c3aed;
    transform:translateY(-3px);
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#aaa;
    text-decoration:none;
}

</style>

</head>
<body>

<div class="container">

    <h1>EDIT PLAYER</h1>

    <form method="POST">

        <label>In Game Name</label>

        <input type="text"
        name="ingame_name"
        value="{{ player['In_Game_Name'] }}">

        <label>Role</label>

        <input type="text"
        name="role"
        value="{{ player['Role'] }}">

        <label>Team</label>

        <select name="team_id">

            {% for team in teams %}

            <option
            value="{{ team['Team_ID'] }}"

            {% if team['Team_ID'] == player['Team_ID'] %}
            selected
            {% endif %}
            >

            {{ team['Team_Name'] }}

            </option>

            {% endfor %}

        </select>

        <label>Country</label>

        <input type="text"
        name="country"
        value="{{ player['Country'] }}">


        <button type="submit">
            SAVE CHANGES
        </button>

    </form>

    <a class="back" href="/">
        ← Back to Home
    </a>

</div>

</body>
</html>
